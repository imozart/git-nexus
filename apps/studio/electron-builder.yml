appId: dev.gitnexus.studio
productName: GitNexus
copyright: GitNexus
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
asar: true
npmRebuild: false # sem módulos nativos
extraResources:
  - { from: build/icon.png, to: icon.png } # ícone da janela em tempo de execução (Linux)
  - { from: ../../CHANGELOG.md, to: CHANGELOG.md } # "Novidades" dentro do app lê este arquivo
  - { from: ../../LICENSE, to: LICENSE.txt } # GPL-3.0: a licença acompanha o programa distribuído
  - { from: ../ui-kit/src/styles/fonts/OFL.txt, to: licenses/JetBrainsMono-OFL.txt } # SIL OFL 1.1: a licença acompanha a fonte distribuída
  - { from: ../../THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md } # componentes de terceiros distribuídos com o app
compression: normal
publish: null # a publicação é feita pelo workflow do GitHub (gh release), não pelo electron-builder

# Somente 64 bits (x64 e arm64). O CI compila uma arquitetura por job (--x64 / --arm64) e
# scripts/verify-arch.mjs reprova o build se houver qualquer binário 32 bits no app empacotado.
# Nome dos artefatos: GitNexus-<versão>-<sistema>-<arquitetura>[-tipo].<ext>

win:
  signExecutable: false # sem certificado de assinatura; mantém os metadados (descrição, produto) no .exe
  target:
    - nsis # instalador (por usuário)
    - zip  # portátil: extrair e executar (dados em GitNexusData/ ao lado do .exe)
  # Só o ZIP usa este nome (o instalador tem o próprio, em nsis.artifactName): GitNexus-<versão>-win-<arq>-portable.zip
  artifactName: GitNexus-${version}-win-${arch}-portable.${ext}
  # (não há alvo "portable" do NSIS: o launcher dele é um processo de 32 bits)
nsis:
  oneClick: false
  perMachine: false # instala por usuário (sem pedir administrador)
  allowToChangeInstallationDirectory: true
  packElevateHelper: false # elevate.exe é um helper de 32 bits, só necessário p/ instalação por máquina + auto-update
  artifactName: GitNexus-${version}-win-${arch}-setup.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: GitNexus-${version}-mac-${arch}.${ext}

linux:
  category: Development
  maintainer: GitNexus <noreply@users.noreply.github.com>
  syncDesktopName: true # grava o desktopName do package.json (liga a janela ao atalho .desktop)
  executableName: gitnexus #sem isto usa o "name" do package.json (@git-nexus/studio), inválido p/ nome de arquivo
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  artifactName: GitNexus-${version}-linux-${arch}.${ext}
