# Configuração do gitleaks (.github/workflows/secret-scan.yml). Usa todas as regras padrão.
# Falso positivo? Não desligue a regra: acrescente um allowlist ESPECÍFICO (arquivo + padrão) abaixo, com o motivo.
title = "GitNexus"

[extend]
useDefault = true

