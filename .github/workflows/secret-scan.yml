name: Segredos

# Varre TODO o histórico (todas as branches) atrás de segredos: tokens, chaves privadas, senhas em URL. O "push protection" do GitHub
# só barra pushes novos; isto cobre também o que já está no histórico, que vira público junto com o repositório.
# Regras: as padrão do gitleaks (.gitleaks.toml). Em caso de falso positivo, acrescente um allowlist ESPECÍFICO lá, com o motivo.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 de gitleaks_8.30.1_linux_x64.tar.gz (do gitleaks_8.30.1_checksums.txt da release oficial)
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # histórico inteiro
          persist-credentials: false

      # Binário oficial com hash conferido (a gitleaks-action pede licença para organizações e é um terceiro a mais).
      - name: Instalar o gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # --redact: o valor do segredo nunca vai para o log da execução (que é visível a quem tem acesso ao repositório).
      - name: Varrer o histórico
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all" --verbose'

      - name: Varrer os arquivos atuais
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --verbose'
