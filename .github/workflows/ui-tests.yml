name: Testes de interface

# Roda as telas de verdade: o harness (apps/studio/scripts/ui-harness) serve o renderer compilado, ligado ao mesmo código de Git do app,
# e um Chrome headless o dirige por CDP (apps/studio/scripts/ui-tests). Cobre o que o vitest não alcança: telas, atalhos e fluxos.
# Sem Electron. As capturas de tela ficam como artefato quando algo falha.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Testes de interface (Chrome headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GN_UI_OUT: ${{ github.workspace }}/ui-test-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar o renderer
        run: pnpm --filter @git-nexus/studio build
      - name: Testes de interface
        run: pnpm --filter @git-nexus/studio ui-test
      - name: Guardar as capturas de tela
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-output
          path: ui-test-output
          retention-days: 7
          if-no-files-found: ignore
