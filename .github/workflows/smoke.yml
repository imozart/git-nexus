name: Teste de fumaça

# Compila o app, empacota (sem instalador) e ABRE de verdade num display virtual (xvfb). O build só verifica que compila;
# aqui se verifica que o app inicia: a janela abre, a interface monta e a ponte preload -> processo principal -> worker responde.
# O app encerra sozinho com código 0 (ok), 1 (falha) ou 2 (tempo esgotado) quando GITNEXUS_SMOKE=1 (apps/studio/src/entrypoints/smoke.ts).
# Depois, o mesmo pacote é usado de verdade pelos testes da janela real (tests-electron): stage, commit, log e idioma de ponta a ponta.

on:
  pull_request:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Teste de fumaça do app empacotado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Cache do Electron
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - name: Compilar (esbuild + vite)
        run: pnpm --filter @git-nexus/studio build
      - name: Empacotar (electron-builder --dir)
        run: pnpm --filter @git-nexus/studio exec electron-builder --linux --x64 --dir --publish never

      - name: Display virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # --no-sandbox: o chrome-sandbox do build descompactado não tem o bit SUID, que o runner não concede (só aqui no teste).
      # --disable-gpu: sem GPU no runner. timeout: rede de segurança além dos 45 s do próprio app.
      - name: Abrir o app e conferir que responde
        env:
          GITNEXUS_SMOKE: '1'
        run: |
          export GITNEXUS_DATA_DIR="$RUNNER_TEMP/gitnexus-data"
          timeout 120 xvfb-run -a --server-args="-screen 0 1280x800x24" \
            apps/studio/release/linux-unpacked/gitnexus --no-sandbox --disable-gpu 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          # o código de saída do app (e não o do tee) decide
          code=${PIPESTATUS[0]}
          grep -q GITNEXUS_SMOKE_OK "$RUNNER_TEMP/smoke.log" && [ "$code" -eq 0 ]

      # O mesmo app empacotado, agora USADO: abre um repositório, faz stage e commit pelo formulário, confere no git de verdade, abre o log e troca
      # de idioma, dirigindo a janela por CDP (apps/studio/scripts/ui-tests/run-electron.mjs). Reaproveita o empacotamento acima: não há build extra.
      - name: Testes de interação na janela real (Electron)
        env:
          GN_APP_ARGS: --no-sandbox --disable-gpu
          GN_UI_OUT: ${{ github.workspace }}/e2e-output
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            node apps/studio/scripts/ui-tests/run-electron.mjs apps/studio/release/linux-unpacked/gitnexus

      - name: Guardar as capturas de tela
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-output
          path: e2e-output
          retention-days: 7
          if-no-files-found: ignore
