name: Release

# A cada merge (push) na main: calcula a versão, compila para Windows/macOS/Linux
# e publica uma Release no GitHub com as notas geradas a partir dos commits.
# Para pular uma release: label "sem-release" no PR antes de aceitá-lo, ou [skip release] na mensagem do commit (valem as duas).
# Nem todo merge publica: só quando algum commit desde a última versão muda o app (feat, fix, perf, refactor, build, breaking ou fora do
# padrão). Merge só de docs/test/ci/style/chore não gera versão nem instaladores; esses commits entram no changelog da próxima release.
# Execução manual (Run workflow) publica sempre.
# Canais: stable (padrão, a cada merge) e beta (toda segunda-feira, se houver novidade, ou à mão: Actions > Release > Run workflow > channel = beta). O beta sai como
# pré-lançamento (vX.Y.Z-beta.N): não vira "última versão", não gera manifestos de pacote e não aparece como atualização no app.
# Depois de uma release ESTÁVEL, o job "Registrar a versão e o CHANGELOG" (release-sync.yml) grava a versão nos package.json e a entrada
# do CHANGELOG.md na main, num commit chore(release).

on:
  push:
    branches: [main]
  # Beta agendado: segunda-feira 11:00 UTC (08:00 em Brasília). Só publica se houver commit que muda o app depois do último beta.
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de incremento de versão (auto = calculado pelos Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      channel:
        description: Canal (stable = release normal; beta = pré-lançamento vX.Y.Z-beta.N)
        type: choice
        options: [stable, beta]
        default: stable

# Uma release por vez: um segundo merge espera o anterior terminar (e herda os commits não lançados).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) Descobre a próxima versão a partir da última tag vX.Y.Z + commits desde então.
  version:
    name: Calcular versão
    # Pula: [skip release] e atualizações de dependência de desenvolvimento / de actions (o Dependabot as junta sozinho; não valem uma release).
    # Manual (workflow_dispatch) sempre roda. Os campos abaixo vêm da mensagem do merge, que carrega o título do PR.
    if: >-
      github.event_name == 'workflow_dispatch' || !(contains(github.event.head_commit.message, '[skip release]')
      || contains(github.event.head_commit.message, 'ci(deps)') || contains(github.event.head_commit.message, 'chore(deps-dev)'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # o passo "Label sem-release" consulta os PRs do commit
    outputs:
      release: ${{ steps.next.outputs.release }} # false = só docs/test/ci/chore desde a última versão: o resto do pipeline é pulado
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # PR com a label "sem-release": não publica; os commits ficam depois da última tag e entram na release seguinte. Só no push (a agenda e a
      # execução manual não têm PR). Sem a saída "release" os jobs seguintes são pulados, como no caso de só docs/test/ci/chore.
      - name: Label sem-release
        id: skip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node scripts/release-skip.mjs
      - name: Próxima versão
        id: next
        if: steps.skip.outputs.skip != 'true'
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          # na agenda o canal é sempre beta; no push, stable; à mão, o que foi escolhido
          CHANNEL: ${{ inputs.channel || (github.event_name == 'schedule' && 'beta') || 'stable' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          # execução manual publica sempre; no push, só se algum commit muda o app (scripts/lib/release-core.mjs: shouldRelease)
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--bump "$BUMP" --channel "$CHANNEL")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$SCHEDULED" = "true" ]; then args+=(--if-new); fi
          node scripts/release-info.mjs next "${args[@]}"

      # CHANGELOG.md com a entrada DESTA versão, gerado antes do build: o app empacota esse arquivo (extraResources) e mostra as novidades da
      # própria versão em uso. Sem isto o arquivo empacotado terminava na versão anterior, pois a entrada só é gravada na main depois da
      # release (release-sync.yml). Gerado uma vez aqui (histórico e tags inteiros) e entregue aos builds. Beta não entra no changelog.
      # Não bloqueia a release: se falhar, o app mostra a versão em uso como entrada provisória, com link para as notas no GitHub.
      - name: CHANGELOG com esta versão
        id: changelog
        if: steps.next.outputs.release == 'true' && steps.next.outputs.prerelease != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: node scripts/changelog.mjs --version "$VERSION" --ref HEAD --repo "$GITHUB_REPOSITORY"
      - name: Guardar o CHANGELOG para os builds
        if: steps.changelog.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1

  # 2) Barreira de qualidade: não publica se typecheck ou testes falharem.
  quality:
    name: Typecheck e testes
    # Espera o cálculo da versão: se o job "Calcular versão" foi pulado ([skip release] etc.) este também é, e se ele decidiu que não há o
    # que publicar (release=false: só docs/test/ci/chore), os testes da release não rodam (o CI do PR já os rodou).
    needs: version
    if: ${{ needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test

  # 3) Compila um pacote por sistema/arquitetura, em paralelo.
  build:
    name: Build ${{ matrix.name }}
    needs: [version, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # A assinatura do Windows (SignPath Foundation) só roda quando o secret e a variável abaixo existem (veja docs/CODE_SIGNING.md).
      SIGN_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash # no Windows o padrão é PowerShell, onde "$VERSION" não lê variável de ambiente
    strategy:
      fail-fast: true # se um build falhar, os demais são cancelados e nenhuma release é publicada
      matrix:
        include:
          - { id: win-x64, name: Windows x64, os: windows-latest, args: --win --x64 }
          - { id: win-arm64, name: Windows ARM64, os: windows-latest, args: --win --arm64 }
          - { id: mac-x64, name: macOS Intel, os: macos-latest, args: --mac --x64 }
          - { id: mac-arm64, name: macOS Apple Silicon, os: macos-latest, args: --mac --arm64 }
          - { id: linux-x64, name: Linux x64, os: ubuntu-latest, args: --linux --x64 }
          - { id: linux-arm64, name: Linux ARM64, os: ubuntu-latest, args: --linux --arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false' # o cache do Electron (abaixo) precisa vir antes: o pós-instalação do pacote "electron" baixa o binário

      # O download do Electron e das ferramentas do electron-builder (NSIS, etc.) é o trecho mais lento de cada build.
      - name: Cache do Electron (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          # uma chave por pacote: x64 e ARM64 baixam binários diferentes do Electron e não podem disputar o mesmo cache
          key: electron-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.id }}-
      - name: Cache do Electron (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          # uma chave por pacote: x64 e ARM64 baixam binários diferentes do Electron e não podem disputar o mesmo cache
          key: electron-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.id }}-
      - name: Cache do Electron (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          # uma chave por pacote: x64 e ARM64 baixam binários diferentes do Electron e não podem disputar o mesmo cache
          key: electron-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.id }}-

      # CHANGELOG com a entrada desta versão (gerado no job "Calcular versão"); entra no pacote como resources/CHANGELOG.md.
      # Sem ele (beta, ou a geração falhou) vale o CHANGELOG do commit.
      - name: CHANGELOG desta versão
        if: needs.version.outputs.prerelease != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: .

      - run: pnpm install --frozen-lockfile

      - name: Dependências de empacotamento (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Compilar (esbuild + vite)
        run: pnpm --filter @git-nexus/studio build

      - name: Empacotar (electron-builder)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pnpm --filter @git-nexus/studio exec electron-builder ${{ matrix.args }} --publish never "-c.extraMetadata.version=$VERSION"

      - name: Verificar que o app é somente 64 bits
        run: node scripts/verify-arch.mjs apps/studio/release ${{ contains(matrix.id, 'arm64') && 'arm64' || 'x64' }}

      # ---- Assinatura de código do Windows (SignPath Foundation) --------------------------------
      # Assina o instalador e o GitNexus.exe do pacote portátil. Sem a configuração, estas etapas são ignoradas
      # e os binários seguem sem assinatura (SmartScreen avisa).
      - name: Windows - separar os arquivos a assinar
        if: runner.os == 'Windows' && env.SIGN_ENABLED == 'true'
        run: |
          UNPACKED="${{ contains(matrix.id, 'arm64') && 'win-arm64-unpacked' || 'win-unpacked' }}"
          mkdir -p sign-in
          cp apps/studio/release/GitNexus-*-setup.exe sign-in/
          cp "apps/studio/release/$UNPACKED/GitNexus.exe" sign-in/GitNexus.exe
          ls -l sign-in

      - name: Windows - enviar para assinatura
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.id }}
          path: sign-in
          retention-days: 1

      - name: Windows - assinar (SignPath)
        if: runner.os == 'Windows' && env.SIGN_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'git-nexus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: sign-out

      - name: Windows - aplicar os arquivos assinados e conferir a assinatura
        if: runner.os == 'Windows' && env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          $rel = 'apps/studio/release'
          $unpacked = "$rel/${{ contains(matrix.id, 'arm64') && 'win-arm64-unpacked' || 'win-unpacked' }}"
          $setup = Get-ChildItem sign-out -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup -or -not (Test-Path sign-out/GitNexus.exe)) { throw 'O SignPath não devolveu os arquivos assinados.' }
          Copy-Item sign-out/GitNexus.exe "$unpacked/GitNexus.exe" -Force
          Copy-Item $setup.FullName "$rel/$($setup.Name)" -Force
          # o ZIP portátil é refeito com o GitNexus.exe assinado (mesma estrutura: o conteúdo da pasta na raiz)
          $zip = Get-ChildItem $rel -Filter 'GitNexus-*-win-*.zip' | Where-Object { $_.Name -notmatch 'setup' } | Select-Object -First 1
          Remove-Item $zip.FullName
          Compress-Archive -Path "$unpacked/*" -DestinationPath $zip.FullName
          foreach ($f in @("$unpacked/GitNexus.exe", "$rel/$($setup.Name)")) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "Assinatura inválida em ${f}: $($s.Status)" }
            Write-Host "OK: $f assinado por $($s.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/studio/release/*.exe
            apps/studio/release/*.zip
            apps/studio/release/*.dmg
            apps/studio/release/*.AppImage
            apps/studio/release/*.deb
            apps/studio/release/*.rpm
            apps/studio/release/*.tar.gz

  # 4) Reúne os pacotes, gera checksums + notas e publica a Release.
  release:
    name: Publicar Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # proveniência (attest-build-provenance): assinatura sem chave, via OIDC
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # SBOM (lista de componentes) em CycloneDX, gerada do lockfile (não precisa instalar nada). Entra no SHA256SUMS e na release.
      # Escopo: tudo o que o lockfile do app resolve, inclusive ferramentas de build; o pacote final embute só o que o vite junta + o Electron.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: SBOM (CycloneDX)
        run: pnpm --filter @git-nexus/studio sbom --sbom-format cyclonedx --sbom-type application --lockfile-only --out "dist/GitNexus-${VERSION}-sbom.cdx.json"

      - name: Checksums SHA-256
        working-directory: dist
        run: |
          ls -lh
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Proveniência assinada de cada arquivo (quem, de qual commit e workflow o gerou). Confira com: gh attestation verify <arquivo> --repo <dono/repo>
      # Só em repositório público: em privado o GitHub exige o plano Enterprise para atestações.
      - name: Atestar a proveniência dos pacotes
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Gerar notas da release
        run: |
          node scripts/release-info.mjs notes --version "$VERSION" --repo "$GITHUB_REPOSITORY" --assets dist --out RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        run: |
          # Reexecução: descarta um rascunho deixado por uma tentativa anterior (nunca mexe em release publicada).
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Cria como rascunho, envia tudo e só então publica: ninguém vê uma release pela metade.
          gh release create "$TAG" dist/* \
            --draft \
            --title "GitNexus $TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
          if [ "$PRERELEASE" = "true" ]; then
            # beta: pré-lançamento, nunca vira a "última versão" (é ela que o app e os gerenciadores de pacote seguem)
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

      # Manifestos de winget/Scoop/Homebrew com os links e SHA-256 desta release (veja docs/PACKAGING.md).
      # Depois da publicação e sem bloquear: um problema aqui não desfaz a release.
      - name: Gerar manifestos dos gerenciadores de pacote
        if: ${{ needs.version.outputs.prerelease != 'true' }}
        continue-on-error: true
        run: node scripts/gen-packaging.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" --sums dist/SHA256SUMS.txt --out packaging-out

      - name: Guardar os manifestos
        if: ${{ hashFiles('packaging-out/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: packaging-manifests
          path: packaging-out
          retention-days: 30

  # 4b) Comenta nos PRs e nas issues desta release a versão em que a mudança chegou (beta e estável). Um comentário só por alvo, atualizado a cada
  # release (a beta vira "Em homologação" e a estável o transforma em "Publicado"); PR agregador lista os agregados. Veja docs/AUTOMATION.md.
  # Não bloqueia nada: continue-on-error, fora do `needs` do notify-failure (uma falha aqui não marca a release como falha) e só roda com a release publicada.
  announce:
    name: Comentar a versão nos PRs e issues
    needs: [version, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # comentar nos PRs
      issues: write # comentar nas issues
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Comentar nos PRs e nas issues
        run: node scripts/release-announce.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --prerelease "$PRERELEASE"

  # 5) Grava no código o que a release estável publicou: a versão nos package.json (como o commit "bump version" de projetos como o
  # Beekeeper Studio) e a entrada do CHANGELOG.md, num commit só na main. Vive em release-sync.yml (workflow reutilizável, que também
  # roda à mão). Não bloqueia nada: se falhar, a release continua publicada. Se a main passar a exigir pull request, o secret
  # RELEASE_PUSH_TOKEN permite o push (docs/AUTOMATION.md). [skip release] no commit evita que ele dispare outra release.
  sync-version:
    name: Registrar a versão e o CHANGELOG
    needs: [version, release]
    if: ${{ needs.version.outputs.prerelease != 'true' }}
    permissions:
      contents: write # o workflow chamado só recebe o que o chamador concede
    uses: ./.github/workflows/release-sync.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}

  # 6) Se qualquer etapa falhar, envia um e-mail com os detalhes (job, passo e trecho do log com o erro).
  # Requer: secrets MAIL_USERNAME e MAIL_PASSWORD (Gmail: senha de app) e a variável NOTIFY_EMAIL. Sem eles, só avisa no log.
  notify-failure:
    name: Notificar falha (issue e e-mail)
    needs: [version, quality, build, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # ler jobs e logs da execução
      issues: write # abrir/comentar a issue de falha
    env:
      GH_TOKEN: ${{ github.token }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Montar relatório da falha
        run: node scripts/failure-report.mjs --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/failure.txt"

      - name: Resumo na página da execução
        run: cat "$RUNNER_TEMP/failure.txt" >> "$GITHUB_STEP_SUMMARY"

      # Registro permanente e pesquisável (o e-mail some na caixa de entrada). Se já há uma issue aberta com o rótulo release-failure,
      # comenta nela em vez de abrir outra. Não bloqueia: a issue é um registro a mais e não pode esconder a falha real.
      - name: Abrir (ou atualizar) a issue de falha
        continue-on-error: true
        run: >-
          node scripts/failure-issue.mjs --repo "$GITHUB_REPOSITORY" --run-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --report "$RUNNER_TEMP/failure.txt"

      - name: Enviar e-mail
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.NOTIFY_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: GitNexus CI <${{ env.MAIL_USERNAME }}>
          to: ${{ env.NOTIFY_EMAIL }}
          subject: "[GitNexus] Falha na release - ${{ github.repository }}@${{ github.ref_name }} (execução #${{ github.run_number }})"
          body: file://${{ runner.temp }}/failure.txt

      - name: Aviso quando o e-mail não está configurado
        if: ${{ env.MAIL_USERNAME == '' || env.MAIL_PASSWORD == '' || env.NOTIFY_EMAIL == '' }}
        run: echo "::warning::E-mail não enviado - configure os secrets MAIL_USERNAME e MAIL_PASSWORD e a variável NOTIFY_EMAIL."
