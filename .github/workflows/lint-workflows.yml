name: Lint dos workflows

# actionlint confere os workflows (sintaxe, expressões ${{ }}, permissões, scripts de shell via shellcheck) antes do merge.
# Sem filtro de pastas de propósito: se for verificação obrigatória do ruleset, precisa reportar em todo PR.

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  # sha256 de actionlint_1.7.12_linux_amd64.tar.gz (do actionlint_1.7.12_checksums.txt da release oficial)
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    name: Lint dos workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Binário oficial com hash conferido (sem action de terceiros e sem executar script baixado).
      - name: Instalar o actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Verificar os workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
