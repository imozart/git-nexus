name: Cobertura

# Roda os testes com cobertura, mostra o resumo na página da execução e reprova se cair abaixo do piso de vitest.config.ts.

on:
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Cobertura de testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes com cobertura
        run: pnpm test:coverage
      # always(): mostra o resumo também quando o piso reprova (aí o relatório é o que explica a falha)
      - name: Resumo da cobertura
        if: ${{ always() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
