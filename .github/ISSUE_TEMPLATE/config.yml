# Configuração da tela "New issue": só formulários (sem issue em branco) e atalhos para onde a dúvida costuma ter resposta.
# Vulnerabilidade vai pelo relato privado do GitHub (Settings > Code security > Private vulnerability reporting, já ligado), nunca em issue pública.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Relatar uma vulnerabilidade (privado)
    url: https://github.com/imozart/git-nexus/security/advisories/new
    about: Falha de segurança não vai em issue pública. Veja a política em SECURITY.md.
  - name: 📖 README e guia de uso
    url: https://github.com/imozart/git-nexus#readme
    about: Instalação, atalhos, repositórios grandes, política do time e atualizações.
  - name: 🌐 Como adicionar um idioma
    url: https://github.com/imozart/git-nexus/blob/main/docs/I18N.md
    about: Passo a passo para traduzir o app e abrir o PR.
